[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distill"
version = "0.1.0"
description = "Map-Reduce & Knowledge-Graph Synthesis Pipeline for PowerPoint Lecture Decks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Awesome06" }
]
dependencies = [
    "python-pptx>=1.0.0",
    "lxml>=5.1.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
distill = "distill.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
exclude = [
    ".agent",
    ".agents",
    ".venv",
    "build",
    "dist",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
